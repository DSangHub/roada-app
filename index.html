<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roada.app — Savings for High-Mileage Professionals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system_ui, sans-serif; }
    .lang-es { display: none; }
    body.spanish .lang-en { display: none; }
    body.spanish .lang-es { display: block; }
    body.spanish span.lang-en, body.spanish a.lang-en { display: none; }
    body.spanish span.lang-es, body.spanish a.lang-es { display: inline; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <!-- Full landing page content is in the local file; this push updates the structure. Images referenced as imagine_images/*.jpg -->
  <h1>Roada Landing Page</h1>
  <p>Complete version available in the artifacts. Mileage tracker, food receipt scanner, Silver (2k mi), Gold (5k mi), $500 food bonus included in the local HTML.</p>
  <script>
    const toggle = document.getElementById('langToggle');
    if (toggle) toggle.addEventListener('click', () => {
      document.body.classList.toggle('spanish');
    });
  </script>
</body>
</html>
